<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KaffePOS - Halaman tidak ditemukan</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #ffffff;
        color: #0f172a;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(420px, calc(100vw - 32px));
        text-align: center;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        border: 1px solid #fed7aa;
        border-radius: 999px;
        padding: 8px 12px;
        color: #ff6b00;
        background: #fff7ed;
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 {
        margin: 18px 0 10px;
        font-size: 28px;
        line-height: 1.1;
      }
      p {
        margin: 0;
        color: #64748b;
        font-size: 14px;
        line-height: 1.7;
        font-weight: 600;
      }
      a {
        margin-top: 22px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        border-radius: 14px;
        padding: 0 18px;
        color: #ffffff;
        background: #ff6b00;
        text-decoration: none;
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">KaffePOS</span>
      <h1>Halaman tidak ditemukan</h1>
      <p>Alamat ini tidak tersedia atau sudah berubah. Data toko tetap aman.</p>
      <a href="/">Kembali ke Dashboard</a>
    </main>
  </body>
</html>

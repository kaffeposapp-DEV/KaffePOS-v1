<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0f19" />
  <title>KaffePOS Offline</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0f19;
      color: #f8fafc;
    }
    main {
      width: min(440px, 100%);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.88);
      padding: 28px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.32);
    }
    .mark {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      margin-bottom: 20px;
      background: #d8823b;
      color: white;
      font-weight: 900;
      font-size: 24px;
      font-style: italic;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 24px;
      line-height: 1.15;
      letter-spacing: 0;
    }
    p {
      margin: 0;
      color: #cbd5e1;
      line-height: 1.65;
      font-size: 15px;
    }
    button {
      margin-top: 24px;
      width: 100%;
      border: 0;
      border-radius: 16px;
      background: #d8823b;
      color: white;
      padding: 14px 16px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark">K</div>
    <h1>Mode Offline Aktif</h1>
    <p>
      KaffePOS belum bisa mengambil halaman terbaru dari server. Jika aplikasi sudah pernah dibuka,
      kembali ke tab utama untuk memakai data lokal dan antrean sinkronisasi.
    </p>
    <button type="button" onclick="window.location.reload()">Coba Muat Ulang</button>
  </main>
</body>
</html>
